<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<title>Wolf Host</title>

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<link
rel="icon"
type="image/png"
href="/logo.png"
/>

<style>

body{
background:#0b0f19;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
font-family:Arial;
overflow:hidden;
}

.box{
text-align:center;
}

img{
width:140px;
margin-bottom:20px;
filter:drop-shadow(0 0 25px #00bfff);
}

h1{
font-size:45px;
margin:0;
}

p{
opacity:.7;
margin-top:10px;
}

.loader{
margin:auto;
margin-top:30px;
width:45px;
height:45px;
border:4px solid #1e293b;
border-top:4px solid #00bfff;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

</style>

</head>

<body>

<div class="box">

<img src="/logo.png">

<h1>Wolf Host</h1>

<p>Secure Cloud Network</p>

<div class="loader"></div>

</div>

<script>
setTimeout(()=>{
location.href="/"
},1200)
</script>

</body>
</html>
